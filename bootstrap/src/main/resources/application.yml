spring:
  main:
    lazy-initialization: true
  application:
    name: ms-securitytoken-facade

  # ── Jackson 3 / Boot 4 ──────────────────────────────────────────────
  # Namespaces corregidos vs Boot 3.5:
  #   default-property-inclusion → raíz (no bajo .mapper)
  #   write-dates-as-timestamps  → .datatype.datetime (no .serialization)
  #   .mapper                    → solo MapperFeature enums
  jackson:
    time-zone: ${TIMEZONE:UTC}
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false   # ya es default en Jackson 3
    mapper:
      sort-properties-alphabetically: true

  # Virtual Threads — Boot 4
  threads:
    virtual:
      enabled: true

  # API Versioning nativo — Framework 7
  webflux:
    apiversion:
      header-name: X-API-Version
      default-version: "1.0"

server:
  port: 8080
  address: 0.0.0.0

# Equivalente a las tablas ConfigMap/Secret del documento.
# En un ambiente real: "sso.url" y "timeout-ms" van en ConfigMap (no sensibles),
# "channels.*.llave" y "channels.*.iv" van en Secret (K8s Secret / Vault) — NUNCA
# en texto plano en este archivo como está aquí, que es solo para desarrollo local.
security-token:
  sso:
    # Apunta al Keycloak del docker-compose anterior (realm api-ext-dev).
    # En AWS/OCP real sería la URL interna del servicio de Keycloak.
    # http://localhost:18080/realms/api-ext-dev/protocol/openid-connect/token
    url: ${SSO_URL:}
    timeout-ms: ${SSO_TIMEOUT_MS:1500}
  channels:
    "8":
      # llave y iv deben estar en Secret (K8s Secret / Vault)
      llave: ${CHANNEL_8_KEY:CHANGEME-32-CHARS-LLAVE-CANAL8!!}
      iv: ${CHANNEL_8_IV:CHANGEME16CHARIV}
    "9":
      llave: ${CHANNEL_9_KEY:CHANGEME-32-CHARS-LLAVE-CANAL9!!}
      iv: ${CHANNEL_9_IV:CHANGEME16CHRIV2}

# Springdoc 3.x (compatible Boot 4)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    description: "Genera un token de acceso a partir de credenciales
                  enviadas mediante application/x-www-form-urlencoded."
    version: "1.0.0"
    encoding: "UTF-8"
    java:
      version: "21"
    url: "http://localhost:8080"
  raulrobinson:
    archetype:
      version: "1.0.0"
      architecture: "Clean Architecture + Hexagonal"
      libraries:
        - "com.raulbolivar:1.0.0-SNAPSHOT"

support:
  logging:
    level: DEBUG
    masking:
      enabled: true
      fields:
        body:
          type: LEFT
          visible: 40
        authorization:
          type: FULL
        password:
          type: FULL
        clientSecret:
          type: FULL
        cardNumber:
          type: RIGHT
          visible: 4
        accountNumber:
          type: RIGHT
          visible: 4
        customerId:
          type: LEFT
          visible: 3
        email:
          type: NONE

# Actuator — Liveness/Readiness ON per defecto in Boot 4
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries,prometheus,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    info:
      access: unrestricted
    metrics:
      access: unrestricted
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

app:
  base-path: /auth/realms
  exception:
    type: ${EXCEPTION_TYPE:https://live.integration.raulrobinson.com/errors}

logging:
  level:
    root: INFO
    com.raulbolivar.securitytoken: DEBUG